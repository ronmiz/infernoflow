# .github/workflows/infernoflow.yml
# Drop this file into your project to get PR comments with gotcha warnings.
#
# Requirements:
#   - Run: infernoflow init  (creates .ai-memory/)
#   - Log gotchas: infernoflow log "..." --type gotcha
#   - Commit .ai-memory/ (infernoflow keeps the right files gitignored)
#
# The action will comment on every PR showing which gotchas and decisions
# are relevant to the files being changed.

name: infernoflow PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write   # needed to post PR comments
  contents: read

jobs:
  infernoflow:
    name: Memory Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: infernoflow PR Check
        uses: ronmiz/infernoflow/action@action-v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # sessions-file: .ai-memory/global.jsonl  # default: all of .ai-memory/
          # min-type: both                           # gotcha | decision | both
          # fail-on-frozen: false                    # set true to block PRs touching frozen caps
