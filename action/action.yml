name: 'infernoflow PR Check'
description: 'Posts a PR comment warning about gotchas and decisions that affect changed files'
author: 'infernoflow'

branding:
  icon: 'flame'
  color: 'orange'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  sessions-file:
    description: 'Path to sessions.jsonl (relative to repo root)'
    required: false
    default: 'inferno/sessions.jsonl'
  min-type:
    description: 'Minimum entry type to surface: gotcha | decision | both'
    required: false
    default: 'both'
  fail-on-frozen:
    description: 'Exit with error code if a frozen capability is touched'
    required: false
    default: 'false'

runs:
  using: 'node20'
  main: 'dist/index.js'
