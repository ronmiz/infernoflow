name: 'infernoflow PR Check'
description: 'PR comment: memory added by the PR (for review), plus gotchas and decisions that affect the changed files'
author: 'infernoflow'

branding:
  icon: 'flame'
  color: 'orange'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  sessions-file:
    description: 'Optional single JSONL file. Default: all shared files in .ai-memory/ (legacy inferno/sessions.jsonl as fallback)'
    required: false
    default: ''
  min-type:
    description: 'Minimum entry type to surface: gotcha | decision | both'
    required: false
    default: 'both'
  fail-on-frozen:
    description: 'Exit with error code if a frozen capability is touched'
    required: false
    default: 'false'

runs:
  using: 'node20'
  main: 'dist/index.js'
