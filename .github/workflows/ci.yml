name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    name: Smoke (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
        # Trim a couple of cells we don't need — Node 18 is fine to verify on
        # one OS, save the matrix runs.
        exclude:
          - os: macos-latest
            node: 18
          - os: windows-latest
            node: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: Smoke suite
        run: npm test

  lint:
    name: Syntax check
    # Stays ubuntu-only — uses `find` which is Unix-specific.
    # Cross-platform syntax coverage comes from the smoke matrix above.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check bin/infernoflow.mjs syntax
        run: node --input-type=module --check < bin/infernoflow.mjs

      - name: Check all lib/**/*.mjs syntax
        run: |
          find lib -name "*.mjs" | while read f; do
            node --input-type=module --check < "$f" || exit 1
          done

      - name: Check all scripts/*.mjs syntax
        run: |
          find scripts -name "*.mjs" | while read f; do
            node --input-type=module --check < "$f" || exit 1
          done

  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    # Only run on PRs to catch packaging issues before merge
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: npm pack dry run
        run: npm pack --dry-run
