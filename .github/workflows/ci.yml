name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    name: Tests (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The test toolchain (vitest 5) needs Node 22.12+. Older Node versions
        # the CLI supports are covered by the `runtime` job below.
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: Built output matches the committed dist/
        shell: bash
        # Content only: the build marks bin files executable, which a commit
        # made on Windows doesn't record.
        run: git -c core.fileMode=false diff --exit-code -- dist

      - name: Test suite
        run: npm test

  runtime:
    name: Runtime (${{ matrix.os }} · Node ${{ matrix.node }})
    # The CLI has zero runtime dependencies and supports Node 18+. Run the
    # committed dist/ end to end, without dev dependencies.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Runtime smoke
        run: node scripts/runtime-smoke.mjs

  lint:
    name: Syntax check
    # Stays ubuntu-only — uses `find` which is Unix-specific.
    # Cross-platform syntax coverage comes from the smoke matrix above.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check bin/infernoflow.mjs syntax
        run: node --input-type=module --check < bin/infernoflow.mjs

      - name: Check all lib/**/*.mjs syntax
        run: |
          find lib -name "*.mjs" | while read f; do
            node --input-type=module --check < "$f" || exit 1
          done

      - name: Check all scripts/*.mjs syntax
        run: |
          find scripts -name "*.mjs" | while read f; do
            node --input-type=module --check < "$f" || exit 1
          done

  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    # Only run on PRs to catch packaging issues before merge
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: npm pack dry run
        run: npm pack --dry-run
