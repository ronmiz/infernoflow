name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    name: Smoke tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: Smoke — core
        run: node scripts/smoke.mjs

      - name: Smoke — JSON output
        run: node scripts/json-smoke.mjs

      - name: Smoke — JSON negative cases
        run: node scripts/json-negative-smoke.mjs

      - name: Smoke — implement
        run: node scripts/implement-smoke.mjs

      - name: Smoke — adopt
        run: node scripts/adopt-smoke.mjs

      - name: Smoke — pr-impact
        run: node scripts/pr-impact-smoke.mjs

      - name: Smoke — sync
        run: node scripts/sync-smoke.mjs

      - name: Smoke — run
        run: node scripts/run-smoke.mjs

  lint:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check bin/infernoflow.mjs syntax
        run: node --input-type=module --check < bin/infernoflow.mjs

      - name: Check all lib/**/*.mjs syntax
        run: |
          find lib -name "*.mjs" | while read f; do
            node --input-type=module --check < "$f" || exit 1
          done

      - name: Check all scripts/*.mjs syntax
        run: |
          find scripts -name "*.mjs" | while read f; do
            node --input-type=module --check < "$f" || exit 1
          done

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    # Only run on PRs to catch packaging issues before merge
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Build
        run: node build.mjs

      - name: npm pack dry run
        run: npm pack --dry-run
