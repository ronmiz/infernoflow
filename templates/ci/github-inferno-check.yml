name: infernoflow-check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  inferno:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --strict: fail if the capability contract is missing (a PR that deletes
      # inferno/ must not pass as a memory-only project).
      - name: infernoflow check
        run: npx --yes infernoflow check --strict
