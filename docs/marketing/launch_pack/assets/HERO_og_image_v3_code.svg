<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="fireCode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
    <linearGradient id="bgCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f16"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <radialGradient id="glowCode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgCode)"/>
  <circle cx="600" cy="315" r="450" fill="url(#glowCode)"/>

  <text x="60" y="55" fill="#5b6172" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="2">🔥 INFERNOFLOW</text>
  <text x="60" y="80" fill="#a0a6b1" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">Persistent memory for AI coding sessions</text>

  <!-- LEFT: Copilot Chat mock — shows real amp_read call (product demo, not a claim) -->
  <g transform="translate(60, 130)">
    <rect width="640" height="440" rx="12" fill="#141826" stroke="#252b3d" stroke-width="1"/>

    <rect width="640" height="36" rx="12" fill="#1a1f30"/>
    <rect y="24" width="640" height="12" fill="#1a1f30"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="5" fill="#27c93f"/>
    <text x="320" y="22" text-anchor="middle" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="11">AI assistant · in-editor</text>

    <rect x="20" y="60" width="600" height="70" rx="8" fill="#1e2540"/>
    <text x="35" y="82" fill="#87ceeb" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="600">You</text>
    <text x="35" y="105" fill="#c8cfda" font-family="-apple-system, sans-serif" font-size="14">Add a Prisma migration to normalize the tags column.</text>

    <rect x="20" y="150" width="600" height="270" rx="8" fill="#0e1420" stroke="#252b3d"/>
    <text x="35" y="172" fill="#FFAB00" font-family="Menlo, Consolas, monospace" font-size="12" font-weight="600">🤖 Assistant</text>

    <rect x="35" y="188" width="230" height="24" rx="12" fill="rgba(255,107,53,0.15)" stroke="#FF6B35" stroke-width="1"/>
    <text x="150" y="205" text-anchor="middle" fill="#FF6B35" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="600">▸ amp_read (prisma/schema.prisma)</text>

    <text x="35" y="238" fill="#c8cfda" font-family="-apple-system, sans-serif" font-size="14">I noticed a logged</text>
    <text x="35" y="260" fill="#c8cfda" font-family="-apple-system, sans-serif" font-size="14">gotcha from 3 weeks ago:</text>

    <rect x="35" y="275" width="570" height="90" rx="6" fill="#1a1f30" stroke="#3a2010"/>
    <line x1="35" y1="275" x2="35" y2="365" stroke="#FF6B35" stroke-width="3"/>
    <text x="50" y="300" fill="#FFAB00" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🔥 gotcha · prisma/schema.prisma</text>
    <text x="50" y="325" fill="#a0a6b1" font-family="-apple-system, sans-serif" font-size="13" font-style="italic">"Prisma 6 holds a DLL lock on</text>
    <text x="50" y="345" fill="#a0a6b1" font-family="-apple-system, sans-serif" font-size="13" font-style="italic">query_engine.dll while tsx watch is running..."</text>

    <text x="35" y="395" fill="#c8cfda" font-family="-apple-system, sans-serif" font-size="14">Want me to stop the watcher first?</text>
  </g>

  <!-- RIGHT: Honest headline + explanation -->
  <g transform="translate(730, 165)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">Every new AI session</text>
    <text x="0" y="48" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">starts cold.</text>
    <text x="0" y="102" fill="url(#fireCode)" font-family="-apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">infernoflow makes them stick.</text>

    <text x="0" y="150" fill="#a0a6b1" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">The AI logs gotchas mid-session,</text>
    <text x="0" y="172" fill="#a0a6b1" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">recalls them next time.</text>

    <!-- Feature list -->
    <g transform="translate(0, 210)">
      <text x="0" y="0" fill="#FF6B35" font-family="Menlo, monospace" font-size="14" font-weight="700">▸</text>
      <text x="24" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Cursor · Claude Code · Copilot · Windsurf</text>
    </g>
    <g transform="translate(0, 240)">
      <text x="0" y="0" fill="#FF6B35" font-family="Menlo, monospace" font-size="14" font-weight="700">▸</text>
      <text x="24" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Local JSONL · git-tracked · MIT</text>
    </g>
    <g transform="translate(0, 270)">
      <text x="0" y="0" fill="#FF6B35" font-family="Menlo, monospace" font-size="14" font-weight="700">▸</text>
      <text x="24" y="0" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Open protocol (AMP)</text>
    </g>

    <rect x="0" y="305" width="400" height="52" rx="8" fill="#141826" stroke="#252b3d"/>
    <text x="20" y="337" fill="#7cd992" font-family="Menlo, Consolas, monospace" font-size="14">$ npm i -g infernoflow</text>
  </g>

  <text x="60" y="595" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">infernoflow.dev</text>
</svg>
