<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f16"/>
      <stop offset="50%" stop-color="#12141d"/>
      <stop offset="100%" stop-color="#0d0f16"/>
    </linearGradient>
    <linearGradient id="fireHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="60%" stop-color="#F7931E"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="1050" cy="120" r="200" fill="url(#glow)"/>
  <circle cx="150" cy="530" r="180" fill="url(#glow)" opacity="0.5"/>

  <!-- Corner mark -->
  <text x="60" y="65" fill="#5b6172" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="500" letter-spacing="2">🔥 INFERNOFLOW</text>

  <!-- Main headline (README line 3, verbatim opening) -->
  <text x="60" y="220" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">Every new AI session</text>
  <text x="60" y="290" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">starts cold.</text>
  <text x="60" y="365" fill="url(#fireHero)" font-family="-apple-system, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">infernoflow makes them stick.</text>

  <!-- Subtitle -->
  <text x="60" y="418" fill="#a0a6b1" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400">Persistent memory for AI coding sessions.</text>
  <text x="60" y="447" fill="#a0a6b1" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400">Cursor · Claude Code · Copilot Chat · Windsurf.</text>

  <!-- Feature bar -->
  <g transform="translate(60, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35"/>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Session bookmarks</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">Auto-harvest transcripts</text>
  </g>

  <g transform="translate(320, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35"/>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Editor squigglies</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">Gotchas as Problems</text>
  </g>

  <g transform="translate(560, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35"/>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Open protocol (AMP)</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">Vendor-neutral, MIT</text>
  </g>

  <g transform="translate(870, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35"/>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Local-first</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">No telemetry, no SaaS</text>
  </g>

  <!-- Bottom URL -->
  <text x="60" y="590" fill="#7c8496" font-family="-apple-system, sans-serif" font-size="15" font-weight="500">infernoflow.dev  ·  npm i -g infernoflow</text>

  <!-- Flame icon top-right -->
  <g transform="translate(1000, 200)">
    <path d="M0,-120 Q30,-70 25,-30 Q50,-50 55,-10 Q60,40 30,80 Q0,120 -30,80 Q-60,40 -55,-10 Q-50,-50 -25,-30 Q-30,-70 0,-120 Z"
          fill="url(#fireHero)" opacity="0.85"/>
    <path d="M0,-70 Q15,-40 12,-15 Q25,-25 28,-5 Q30,25 15,45 Q0,60 -15,45 Q-30,25 -28,-5 Q-25,-25 -12,-15 Q-15,-40 0,-70 Z"
          fill="#ffffff" opacity="0.15"/>
  </g>
</svg>
