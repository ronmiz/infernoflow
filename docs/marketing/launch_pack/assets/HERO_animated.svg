<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f16"/>
      <stop offset="50%" stop-color="#12141d"/>
      <stop offset="100%" stop-color="#0d0f16"/>
    </linearGradient>
    <linearGradient id="fireA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35">
        <animate attributeName="stop-color" values="#FF6B35;#FF8C42;#FF6B35" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#F7931E">
        <animate attributeName="stop-color" values="#F7931E;#FFAB00;#F7931E" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFAB00">
        <animate attributeName="stop-color" values="#FFAB00;#FFC947;#FFAB00" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgA)"/>

  <circle cx="1050" cy="120" r="200" fill="url(#glowA)">
    <animate attributeName="r" values="200;230;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="530" r="180" fill="url(#glowA)" opacity="0.5">
    <animate attributeName="r" values="180;210;180" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="4s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <text x="60" y="65" fill="#5b6172" font-family="-apple-system, Segoe UI, sans-serif" font-size="14" font-weight="500" letter-spacing="2">
    🔥 INFERNOFLOW
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Headline (README line 3, verbatim) -->
  <text x="60" y="220" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">Every new AI session</text>
  <text x="60" y="290" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">starts cold.</text>
  <text x="60" y="365" fill="url(#fireA)" font-family="-apple-system, Segoe UI, sans-serif" font-size="60" font-weight="800" letter-spacing="-1">infernoflow makes them stick.</text>

  <text x="60" y="418" fill="#a0a6b1" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400">Persistent memory for AI coding sessions.</text>
  <text x="60" y="447" fill="#a0a6b1" font-family="-apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400">Cursor · Claude Code · Copilot Chat · Windsurf.</text>

  <g transform="translate(60, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Session bookmarks</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">Auto-harvest transcripts</text>
  </g>

  <g transform="translate(320, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Editor squigglies</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">Gotchas as Problems</text>
  </g>

  <g transform="translate(560, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Open protocol (AMP)</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">Vendor-neutral, MIT</text>
  </g>

  <g transform="translate(870, 505)">
    <rect width="8" height="8" rx="2" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="18" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Local-first</text>
    <text x="18" y="30" fill="#5b6172" font-family="-apple-system, sans-serif" font-size="13">No telemetry, no SaaS</text>
  </g>

  <text x="60" y="590" fill="#7c8496" font-family="-apple-system, sans-serif" font-size="15" font-weight="500">infernoflow.dev  ·  npm i -g infernoflow</text>

  <!-- Animated flame -->
  <g transform="translate(1000, 200)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;0.97;1.03;1" dur="1.8s" repeatCount="indefinite" additive="sum"/>
      <animateTransform attributeName="transform" type="rotate" values="-1;1;-1" dur="1.5s" repeatCount="indefinite" additive="sum"/>

      <path d="M0,-120 Q30,-70 25,-30 Q50,-50 55,-10 Q60,40 30,80 Q0,120 -30,80 Q-60,40 -55,-10 Q-50,-50 -25,-30 Q-30,-70 0,-120 Z"
            fill="url(#fireA)" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.75;0.95;0.85;0.9" dur="1.4s" repeatCount="indefinite"/>
      </path>

      <path d="M0,-70 Q15,-40 12,-15 Q25,-25 28,-5 Q30,25 15,45 Q0,60 -15,45 Q-30,25 -28,-5 Q-25,-25 -12,-15 Q-15,-40 0,-70 Z"
            fill="#ffffff" opacity="0.18">
        <animate attributeName="opacity" values="0.18;0.28;0.1;0.22;0.18" dur="1.4s" repeatCount="indefinite"/>
      </path>

      <ellipse cx="0" cy="10" rx="8" ry="18" fill="#FFF5D6" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.9;0.4;0.7;0.6" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="18;22;16;20;18" dur="0.8s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
